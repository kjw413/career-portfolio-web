name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *" # 매일 03:17 KST, GitHub 예약 실행은 지연될 수 있음
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pages 자동 활성화는 토큰 권한상 실패할 수 있음(최초 1회는 저장소
      # Settings → Pages → Source: GitHub Actions 수동 설정 필요).
      # 실패해도 빌드는 계속 진행하고, 활성화 여부는 deploy 단계에서 판정된다.
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Refresh public GitHub repository metadata
        run: npm run sync:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /career-portfolio-web

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
