<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 566" width="1000" height="566" role="img" aria-label="MIS RPA 실행 흐름 재구성: 3종 데이터를 5개 공장에서 순차 수집하고 그리드 지문 검사를 통과한 뒤, 재가공 단계에서 표준 데이터셋을 생성하는 콘솔 출력 형태의 도식입니다.">
  <defs>
    <style>
      .win { fill: #0c1f3d; }
      .chrome { fill: #0a1830; }
      .dot1 { fill: #ff5f57; } .dot2 { fill: #febc2e; } .dot3 { fill: #28c840; }
      .t-chrome { fill: #7fa9dc; font: 10px ui-monospace, monospace; letter-spacing: .1em; }
      .m { font: 12.5px ui-monospace, monospace; }
      .cmd { fill: #dceafb; }
      .dim { fill: #7fa9dc; }
      .key { fill: #60a5fa; }
      .ok { fill: #4ade80; }
      .warn { fill: #fbbf24; }
      .step { fill: #ffffff; font: 700 12.5px ui-monospace, monospace; }
      .rule { fill: none; stroke: #24456f; stroke-width: 1; }
      .badge { fill: #eaf3ff; stroke: #1769e0; stroke-width: 1; }
      .t-badge { fill: #0b3d91; font: 700 9px ui-monospace, monospace; letter-spacing: .1em; }
    </style>
  </defs>

  <rect width="1000" height="566" fill="#f8fbff"/>

  <!-- window -->
  <rect class="win" x="0" y="26" width="1000" height="540"/>
  <rect class="chrome" x="0" y="26" width="1000" height="30"/>
  <circle class="dot1" cx="20" cy="41" r="5"/>
  <circle class="dot2" cx="38" cy="41" r="5"/>
  <circle class="dot3" cx="56" cy="41" r="5"/>
  <text class="t-chrome" x="78" y="45">전체_RPA_자동실행.bat</text>

  <!-- reconstruction badge -->
  <rect class="badge" x="784" y="0" width="216" height="20"/>
  <text class="t-badge" x="796" y="14">실행 흐름 재구성 · 실제 화면 아님</text>

  <!-- body -->
  <text class="m" x="24" y="82"><tspan class="key">E:\AI-Elite-MIS_RPA&gt;</tspan><tspan class="cmd" dx="8">python run_all_rpa.py</tspan></text>

  <text class="m dim" x="24" y="112">  MIS 데이터 수집 — 생산실적 · 유틸리티 · 재공품</text>
  <text class="m dim" x="24" y="132">  사업장    : 남양주1, 남양주2, 김해, 광주, 논산</text>
  <text class="m dim" x="24" y="152">  조회 횟수 : 15회  (예상 1분)</text>
  <text class="m dim" x="24" y="172">  적재 대상 : RawDB_*.xlsx  (웹앱이 읽는 파일)</text>
  <text class="m warn" x="24" y="192">  ※ 실행 중 마우스/키보드를 사용하지 마세요 (좌표 클릭 기반).</text>

  <text class="step" x="24" y="228">[1/3] 생산실적 수집</text>
  <text class="m dim" x="24" y="248">      남양주1 <tspan class="ok">✓</tspan>  남양주2 <tspan class="ok">✓</tspan>  김해 <tspan class="ok">✓</tspan>  광주 <tspan class="ok">✓</tspan>  논산 <tspan class="ok">✓</tspan></text>
  <text class="m dim" x="24" y="268">      그리드 지문(SHA-1) 검사 — 공장별 상이, 재복사 없음 <tspan class="ok">✓</tspan></text>

  <text class="step" x="24" y="304">[2/3] 유틸리티 수집 — 원단위 실적입력(일단위) 화면</text>
  <text class="m dim" x="24" y="324">      남양주1 <tspan class="ok">✓</tspan>  남양주2 <tspan class="ok">✓</tspan>  김해 <tspan class="ok">✓</tspan>  광주 <tspan class="ok">✓</tspan>  논산 <tspan class="ok">✓</tspan></text>
  <text class="m dim" x="24" y="344">      믹스생산량 역동기화 (생산실적 → 에너지) <tspan class="ok">✓</tspan></text>

  <text class="step" x="24" y="380">[3/3] 재공품 수집</text>
  <text class="m dim" x="24" y="400">      남양주1 <tspan class="ok">✓</tspan>  남양주2 <tspan class="ok">✓</tspan>  김해 <tspan class="ok">✓</tspan>  광주 <tspan class="ok">✓</tspan>  논산 <tspan class="ok">✓</tspan></text>

  <line class="rule" x1="24" y1="424" x2="976" y2="424"/>
  <text class="m key" x="24" y="448">  수집 완료 — 가공 시작 (MIS 접속 없음)</text>
  <text class="m dim" x="24" y="470">  production_builder   RawDB_생산실적 → DB_생산실적.xlsx  <tspan class="ok">✓</tspan></text>
  <text class="m dim" x="24" y="490">  wip_refactoring      RawDB_재공품   → DB_재공품.xlsx    <tspan class="ok">✓</tspan></text>
  <text class="m dim" x="24" y="510">  원단위 수식 보완 후 Excel 재계산                        <tspan class="ok">✓</tspan></text>

  <text class="m" x="24" y="542"><tspan class="ok">  완료</tspan><tspan class="dim" dx="6">— 실행 전 자동 백업 생성됨 · 웹앱이 startup에 적재</tspan></text>
</svg>
