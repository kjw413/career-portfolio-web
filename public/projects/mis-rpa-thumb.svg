<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="하루 MIS 수집 업무가 사람이 직접 할 때 40분에서 자동 실행 3분으로 92퍼센트 줄었고, 본인 수집 시간이 하루 40분, 월 22일 기준 약 14.7시간 줄었습니다.">
  <defs>
    <style>
      text { font-family: "Pretendard", "Pretendard Variable", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
      .eyebrow { fill: #1d5fd0; font-size: 18px; font-weight: 800; letter-spacing: .04em; }
      .meta { fill: #55637a; font-size: 15px; font-weight: 600; }
      .label { fill: #55637a; font-size: 16px; font-weight: 700; letter-spacing: .03em; }
      .big { fill: #0d1526; font-size: 46px; font-weight: 800; letter-spacing: -.02em; }
      .big-accent { fill: #1d5fd0; font-size: 46px; font-weight: 800; letter-spacing: -.02em; }
      .sub { fill: #3d4a5c; font-size: 19px; font-weight: 600; }
      .delta { fill: #1d5fd0; font-size: 22px; font-weight: 800; }
      .stat { fill: #1b3a76; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
      .stat-label { fill: #55637a; font-size: 17px; font-weight: 600; }
      .card { fill: #ffffff; stroke: #d9e4f2; stroke-width: 1.5; }
      .edge { fill: none; stroke: #1d5fd0; stroke-width: 3; }
    </style>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#dde6f2"/>
    </pattern>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1b3a76" flood-opacity=".10"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d5fd0"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#f5f8fd"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <text class="eyebrow" x="64" y="72">하루 MIS 수집 업무</text>
  <text class="meta" x="1136" y="72" text-anchor="end">생산실적 · 유틸리티 · 재공품 3종 × 5개 공장</text>

  <rect class="card" x="64" y="104" width="1072" height="328" rx="20" filter="url(#lift)"/>

  <text class="label" x="104" y="156">사람이 직접</text>
  <rect x="104" y="172" width="740" height="72" rx="10" fill="#dbe5f1"/>
  <text class="big" x="128" y="225">40분</text>
  <text class="sub" x="250" y="216">매일 화면 조회 → 복사 → 엑셀 정리</text>

  <text class="label" x="104" y="296">자동 실행</text>
  <rect x="104" y="312" width="56" height="72" rx="10" fill="#1d5fd0"/>
  <text class="big-accent" x="180" y="365">3분</text>
  <text class="sub" x="282" y="356">실행만 걸어두면 3종 수집 · 가공까지 완료</text>

  <path class="edge" d="M900 214 V 336" marker-end="url(#head)"/>
  <text class="delta" x="928" y="284">92% 단축</text>

  <rect class="card" x="64" y="462" width="520" height="84" rx="16"/>
  <text class="stat" x="96" y="515">일 40분</text>
  <text class="stat-label" x="232" y="512">본인 수집 업무 시간 절감</text>

  <rect class="card" x="616" y="462" width="520" height="84" rx="16"/>
  <text class="stat" x="648" y="515">월 약 14.7시간</text>
  <text class="stat-label" x="868" y="512">월 22일 기준 환산</text>
</svg>
