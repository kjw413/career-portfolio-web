<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="투자 실적 검증 도구의 흐름: MIS 등록 내역과 실제 투자실적을 자코드·공장 기준으로 맞추고, 여섯 가지 항목을 점검해 정정 대상 보고서를 만듭니다.">
  <defs>
    <style>
      text { font-family: "Pretendard", "Pretendard Variable", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
      .eyebrow { fill: #1d5fd0; font-size: 18px; font-weight: 800; letter-spacing: .04em; }
      .meta { fill: #55637a; font-size: 15px; font-weight: 600; }
      .label { fill: #1d5fd0; font-size: 13.5px; font-weight: 800; letter-spacing: .08em; }
      .title { fill: #0d1526; font-size: 23px; font-weight: 800; letter-spacing: -.02em; }
      .sub { fill: #3d4a5c; font-size: 15px; font-weight: 600; }
      .panel-title { fill: #ffffff; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
      .panel-sub { fill: #b9c9e6; font-size: 14.5px; font-weight: 600; }
      .chip { fill: #ffffff; font-size: 15.5px; font-weight: 700; }
      .out-title { fill: #0d1526; font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
      .out-row { fill: #3d4a5c; font-size: 14.5px; font-weight: 600; }
      .foot { fill: #3d4a5c; font-size: 15.5px; font-weight: 600; }
      .card { fill: #ffffff; stroke: #d9e4f2; stroke-width: 1.5; }
      .card-accent { fill: #ffffff; stroke: #1d5fd0; stroke-width: 2; }
      .chip-box { fill: #24467f; }
      .line { stroke: #1d5fd0; stroke-width: 2.5; fill: none; }
    </style>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#dde6f2"/>
    </pattern>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1b3a76" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="#f5f8fd"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <text class="eyebrow" x="64" y="70">눈으로 대조하던 두 자료를, 정정할 항목만 남기도록</text>
  <text class="meta" x="1136" y="70" text-anchor="end">Python · Excel · Windows 배치 실행</text>

  <!-- 입력 두 자료 -->
  <g filter="url(#lift)">
    <rect class="card" x="64" y="104" width="268" height="150" rx="18"/>
    <rect class="card" x="64" y="276" width="268" height="150" rx="18"/>
  </g>
  <text class="label" x="90" y="140">입력 1</text>
  <text class="title" x="90" y="176">MIS 등록 내역</text>
  <text class="sub" x="90" y="210">폴더의 가장 최근 파일을</text>
  <text class="sub" x="90" y="234">자동으로 읽음</text>

  <text class="label" x="90" y="312">입력 2</text>
  <text class="title" x="90" y="348">실제 투자실적</text>
  <text class="sub" x="90" y="382">요약표 · 2행 헤더 양식도</text>
  <text class="sub" x="90" y="406">헤더 위치와 열을 자동 탐지</text>

  <path class="line" d="M332 179 H372 V265 H404"/>
  <path class="line" d="M332 351 H372 V265"/>
  <path d="M404 258 l12 7 -12 7z" fill="#1d5fd0"/>

  <!-- 대조와 점검 -->
  <rect x="420" y="104" width="420" height="322" rx="20" fill="#1b3a76"/>
  <text class="panel-title" x="450" y="148">자코드 · 공장 기준으로 맞춘 뒤 점검</text>
  <text class="panel-sub" x="450" y="174">품의금액이 있는 유효 자코드만 검증 대상</text>

  <rect class="chip-box" x="450" y="198" width="172" height="48" rx="10"/>
  <text class="chip" x="536" y="228" text-anchor="middle">전산 미등록</text>
  <rect class="chip-box" x="638" y="198" width="172" height="48" rx="10"/>
  <text class="chip" x="724" y="228" text-anchor="middle">계정코드 미기입</text>
  <rect class="chip-box" x="450" y="258" width="172" height="48" rx="10"/>
  <text class="chip" x="536" y="288" text-anchor="middle">계정코드 오기입</text>
  <rect class="chip-box" x="638" y="258" width="172" height="48" rx="10"/>
  <text class="chip" x="724" y="288" text-anchor="middle">승인금액 미기입</text>
  <rect class="chip-box" x="450" y="318" width="172" height="48" rx="10"/>
  <text class="chip" x="536" y="348" text-anchor="middle">모코드 미기입</text>
  <rect class="chip-box" x="638" y="318" width="172" height="48" rx="10"/>
  <text class="chip" x="724" y="348" text-anchor="middle">투자자 미기입</text>
  <text class="panel-sub" x="450" y="402">판정 근거가 비면 경고하고 그 건은 판정을 보류</text>

  <path class="line" d="M840 265 H872"/>
  <path d="M872 258 l12 7 -12 7z" fill="#1d5fd0"/>

  <!-- 결과 보고서 -->
  <g filter="url(#lift)">
    <rect class="card-accent" x="888" y="104" width="248" height="322" rx="18"/>
  </g>
  <text class="label" x="914" y="140">결과</text>
  <text class="out-title" x="914" y="176">점검결과 엑셀</text>
  <g>
    <rect x="914" y="198" width="196" height="40" rx="8" fill="#eaf1fd"/>
    <text class="out-row" x="930" y="224">요약 — 자코드당 한 행</text>
    <rect x="914" y="246" width="196" height="40" rx="8" fill="#f3f6fb"/>
    <text class="out-row" x="930" y="272">전산미등록</text>
    <rect x="914" y="294" width="196" height="40" rx="8" fill="#f3f6fb"/>
    <text class="out-row" x="930" y="320">계정코드미기입</text>
    <rect x="914" y="342" width="196" height="40" rx="8" fill="#f3f6fb"/>
    <text class="out-row" x="930" y="368">오류 유형별 상세 시트</text>
  </g>
  <text class="sub" x="914" y="408">담당 부서가 고칠 항목만</text>

  <text class="foot" x="64" y="498">사람은 걸러진 후보만 확인합니다. 한 자코드에 여러 오류가 있으면 요약 한 행에 모아 보여 줍니다.</text>
  <text class="foot" x="64" y="530">입력·결과 파일은 사내 자료라 저장소에 올리지 않고, 형식 설명만 공개합니다.</text>
</svg>
