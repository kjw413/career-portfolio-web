<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="원문 비고 '포장기 실러 히터 단선 교체'를 실러에서 씰러로 표준화한 뒤 고장 분야 전기·제어, 상세설비 씰러, 세부 부품 히터, 고장 현상 단선, 조치 교체로 완전 자동분류한 예시. 아래에는 완전 자동분류, 부분 자동분류, 검토 필요의 판정 기준.">
  <defs>
    <style>
      text { font-family: "Pretendard", "Pretendard Variable", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
      .eyebrow { fill: #1d5fd0; font-size: 18px; font-weight: 800; letter-spacing: .04em; }
      .meta { fill: #55637a; font-size: 15px; font-weight: 600; }
      .label { fill: #55637a; font-size: 16px; font-weight: 700; letter-spacing: .03em; }
      .raw { fill: #0d1526; font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
      .raw-hit { fill: #c2410c; }
      .chip-amber { fill: #9a3412; font-size: 17px; font-weight: 700; }
      .note { fill: #55637a; font-size: 16px; }
      .axis { fill: #3d4a5c; font-size: 18px; font-weight: 700; }
      .axis-val { fill: #1b3a76; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
      .action { fill: #55637a; font-size: 18px; font-weight: 700; }
      .action-val { fill: #1b3a76; font-size: 19px; font-weight: 700; }
      .pill-text { fill: #ffffff; font-size: 15px; font-weight: 800; letter-spacing: .02em; }
      .edge { fill: none; stroke: #1d5fd0; stroke-width: 3; }
      .edge-label { fill: #1d5fd0; font-size: 16px; font-weight: 800; }
      .legend { fill: #0d1526; font-size: 18px; font-weight: 800; }
      .legend-sub { fill: #55637a; font-size: 15px; }
      .card { fill: #ffffff; stroke: #d9e4f2; stroke-width: 1.5; }
      .rule { stroke: #e3eaf4; stroke-width: 1.5; }
      .rule-dash { stroke: #c9d8ec; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#dde6f2"/>
    </pattern>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1b3a76" flood-opacity=".10"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d5fd0"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#f5f8fd"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <text class="eyebrow" x="64" y="72">비고 한 줄 → 네 축</text>
  <text class="meta" x="1136" y="72" text-anchor="end">설비 고장 분석기 v1.34.1의 실제 판정</text>

  <!-- 원문 -->
  <rect class="card" x="64" y="104" width="452" height="328" rx="20" filter="url(#lift)"/>
  <text class="label" x="96" y="148">원문 비고</text>
  <text class="raw" x="96" y="216">포장기 <tspan class="raw-hit">실러</tspan> 히터</text>
  <text class="raw" x="96" y="270">단선 교체</text>
  <rect x="96" y="304" width="244" height="44" rx="22" fill="#fff3e3" stroke="#f2c48a" stroke-width="1.5"/>
  <text class="chip-amber" x="218" y="332" text-anchor="middle">표준화 · 실러 → 씰러</text>
  <text class="note" x="96" y="398">오타·약어·잘린 단어가 섞인 자유서술 한 줄</text>

  <!-- 흐름 -->
  <path class="edge" d="M530 268 H 610" marker-end="url(#head)"/>
  <text class="edge-label" x="568" y="250" text-anchor="middle">분류</text>

  <!-- 판정 -->
  <rect class="card" x="628" y="104" width="508" height="328" rx="20" filter="url(#lift)"/>
  <text class="label" x="660" y="148">판정</text>
  <rect x="966" y="126" width="142" height="32" rx="16" fill="#1d5fd0"/>
  <text class="pill-text" x="1037" y="148" text-anchor="middle">완전 자동분류</text>
  <line class="rule" x1="652" y1="172" x2="1112" y2="172"/>

  <text class="axis" x="660" y="206">고장 분야</text>
  <rect x="800" y="181" width="308" height="36" rx="9" fill="#eef4ff"/>
  <text class="axis-val" x="820" y="206">전기·제어</text>

  <text class="axis" x="660" y="254">상세설비</text>
  <rect x="800" y="229" width="308" height="36" rx="9" fill="#eef4ff"/>
  <text class="axis-val" x="820" y="254">씰러</text>

  <text class="axis" x="660" y="302">세부 부품</text>
  <rect x="800" y="277" width="308" height="36" rx="9" fill="#eef4ff"/>
  <text class="axis-val" x="820" y="302">히터</text>

  <text class="axis" x="660" y="350">고장 현상</text>
  <rect x="800" y="325" width="308" height="36" rx="9" fill="#eef4ff"/>
  <text class="axis-val" x="820" y="350">단선</text>

  <line class="rule-dash" x1="652" y1="377" x2="1112" y2="377"/>
  <text class="action" x="660" y="411">조치 (따로 보존)</text>
  <rect x="800" y="388" width="104" height="34" rx="9" fill="none" stroke="#c9d8ec" stroke-width="1.5"/>
  <text class="action-val" x="820" y="411">교체</text>

  <!-- 판정 기준 -->
  <circle cx="74" cy="494" r="9" fill="#1d5fd0"/>
  <text class="legend" x="94" y="501">완전 자동분류</text>
  <text class="legend-sub" x="94" y="528">네 축이 모두 원문에서 확인될 때</text>

  <circle cx="458" cy="494" r="8" fill="#ffffff" stroke="#1d5fd0" stroke-width="2.5"/>
  <path d="M458 486 A8 8 0 0 1 458 502 Z" fill="#1d5fd0"/>
  <text class="legend" x="478" y="501">부분 자동분류</text>
  <text class="legend-sub" x="478" y="528">원문에 없는 축은 추정하지 않고 비워 둠</text>

  <circle cx="842" cy="494" r="9" fill="#d97706"/>
  <text class="legend" x="862" y="501">검토 필요</text>
  <text class="legend-sub" x="862" y="528">의심·대안·근거 부족은 사람이 고름</text>
</svg>
